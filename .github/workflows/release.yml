name: release
on:
  push:
    tags: ["v*"]

permissions:
  contents: read
  id-token: write # npm trusted publishing (OIDC); provenance is generated automatically

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          registry-url: https://registry.npmjs.org
      # Trusted publishing needs npm >= 11.5.1.
      - run: npm install -g npm@11
      - run: pnpm install --frozen-lockfile
      - name: Check tag matches package.json version
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - name: Skip if this version is already on npm
        id: published
        run: |
          if npm view "cdk-vercel@$(node -p 'require("./package.json").version')" version >/dev/null 2>&1; then
            echo "Version already published; skipping."
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - if: steps.published.outputs.skip != 'true'
        run: pnpm lint && pnpm typecheck && pnpm test && pnpm build
      # No token: npm authenticates with the GitHub OIDC token via the trusted publisher.
      - if: steps.published.outputs.skip != 'true'
        run: npm publish --access public
